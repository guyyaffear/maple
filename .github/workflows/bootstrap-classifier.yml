name: Bootstrap classifier

# TEMPORARY, for one manual run, then deleted.
#
# npm registers a trusted publisher only against a package that already exists,
# so @maple-kit/classifier's first publish cannot go through OIDC. `npm stage
# publish` is refused for the same reason — `404 … Package not found` — so a
# token publish is the only door left, and it needs the account's two-factor
# setting on "Authorization only" for the few minutes this run takes.
#
# Removed together with the NPM_TOKEN secret once classifier@0.5.0 is live.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance still comes from the OIDC token, as it does for a release.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Build the packages
        run: pnpm build

      - name: Pack with pnpm
        # pnpm rewrites `workspace:*` to the exact version as it packs; npm,
        # which does not know this is a pnpm workspace, would leave it in place
        # and publish a tarball nobody can install.
        working-directory: packages/classifier
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish it
        run: npm publish "$RUNNER_TEMP/maple-kit-classifier-0.5.0.tgz" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Say what is staged, if anything
        # `npm publish` printed `+ @maple-kit/classifier@0.5.0` and the registry
        # answered 404 for four minutes afterwards, so a publish here can land in
        # staging without saying so. This is the only way to see it, and it runs
        # whether the publish reported success or failed over a staged version.
        if: always()
        run: npm stage list @maple-kit/classifier
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
